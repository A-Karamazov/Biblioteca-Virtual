<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Virtual Library - Adicionar Livro</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
    <script src='main.js' defer></script>
</head>
<body>
    <header>
        <h1>Virtual Library</h1>
        <a href="">Sair</a>
    </header>
    <aside>
        <a href=""></a>
        <a href="">Meus livros</a>
        <a href="">Autores</a>
        <a href="">Categorias</a>
        <a href="">Configurações</a>
    </aside>
    <main>
        <h2 class="books">Adicionar Livro</h2>

        <form class="book-form" id="new-book-form">
            <label for="input-nome">Título do Livro:</label>
            <input type="text" id="input-nome" placeholder="Digite o título do livro" required>

            <label for="input-autor">Autor:</label>
            <input type="text" id="input-autor" placeholder="Digite o nome do autor" required>

            <label for="input-editora">Editora:</label>
            <input type="text" id="input-editora" placeholder="Digite o nome da editora">

            <div class="form-row">
                <div class="form-field">
                    <label for="categorias">Categoria:</label>
                    <select id="categorias" name="categorias">
                        <option value="" selected disabled>Selecione uma categoria</option>
                        <option value="romance">Romance</option>
                        <option value="teatro">Teatro</option>
                        <option value="conto">Conto</option>
                        <option value="poema">Poema</option>
                        <option value="epico">Épico</option>
                        <option value="filosofia">Filosofia</option>
                        <option value="sociologia">Sociologia</option>
                        <option value="logica">Lógica</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="input-tema">Tema:</label>
                    <input type="text" id="input-tema" placeholder="Digite o tema do livro">
                </div>
            </div>

            <label for="link-livro">Link (PDF ou compra):</label>
            <input type="text" id="link-livro" placeholder="Cole o link aqui (opcional)">

            <label for="status">Status:</label>
            <select id="status" name="status">
                <option value="" selected disabled>Selecione o status</option>
                <option value="nao-lido">Não Lido</option>
                <option value="lendo">Lendo</option>
                <option value="lido">Lido</option>
            </select>

            <label for="observacoes">Observações:</label>
            <textarea id="observacoes" rows="4" placeholder="Escreva suas observações sobre o livro (opcional)"></textarea>

            <div class="form-actions">
                <button type="submit" class="salvar-livro">Salvar</button>
                <a class="cancelar" href="index.html">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
