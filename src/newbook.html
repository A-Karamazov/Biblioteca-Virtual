<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Virtual Library</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
    <script src='main.js'></script>
</head>
<body>
    <header>
        <h1>Virtual Library</h1>
        <a href="">Sair</a>
    </header>
    <aside>
        <a href=""></a>
        <a href="">Meus livros</a>
        <a href="">Autores</a>
        <a href="">Categorias</a>
        <a href="">Configurações</a>
    </aside>
    <main>
        <h2 class="first-line books">Meus Livros</h2>

        <label for="input-livro">Título do Livro:</label>
        <input type="text" class="input-livro" placeholder="Digite o nome do Livro">

        <label for="input-autor">Autor:</label>
        <input type="text" class="input-autor" placeholder="Digite o nome do autor">
        
        <label for="input-editora">Editora:</label>
        <input type="text" class="input-editora" placeholder="Digite o nome da editora (opcional)">

        <label for="categorias">Categoria:</label>
        <select id="categorias" name="categorias">
        <option value="romance">Romance</option>
        <option value="teatro">Teatro</option>
        <option value="conto">Conto</option>
        <option value="poema">Poema</option>
        <option value="epico">Épico</option>
        <option value="filosofia">Filosofia</option>
        <option value="sociologia">Sociologia</option>
        <option value="logica">Lógica</option>
        <option value="outro">Outro</option>
        </select>

        <label for="input-tema">Tema:</label>
        <input type="text" class="input-tema" placeholder="Digite o tema do livro (opcional)">

        <label for="link-livro">Link ou pdf:</label>
        <input type="text" class="link-livro" placeholder="Cole um link para acesso (opcional)">
        
        <label for="status">Status:</label>
        <select id="status" name="status">
        <option value="nao-lido">Não Lido</option>
        <option value="lendo">Lendo</option>
        <option value="lido">Lido</option>
        </select>

        <label for="observacoes">Observações:</label>
        <input type="text" class="observacoes" placeholder="Escreva observações sobre o livro (opcional)">

        <button class="salvar-livro">Salvar</button>
        <button class="cancelar">Cancelar</button>
    </main>
</body>
</html>
