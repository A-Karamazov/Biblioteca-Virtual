<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Virtual Library</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
    <script src='main.js' defer></script>
</head>
<body>
    <header>
        <h1>Virtual Library</h1>
    </header>
    <aside>
        <a href="index.html">Meus livros</a>
        <a href="">Autores</a>
        <a href="">Categorias</a>
    </aside>
    <main>
        <h2 class="books">Meus Livros</h2>
        <div class="controls">
            <div class="search-group">
                <input class="search" id="campo-busca" type="text" placeholder="Pesquisar livro, autor, tema...">
                <button class="search_btn" id="botao-buscar">Pesquisar</button>
            </div>
            <a class="add_btn" href="newbook.html">Adicionar Livro</a>
        </div>

        <table class="tabela-livros" id="tabela-livros">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Categoria</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela">
                <!-- As linhas são geradas dinamicamente pelo main.ts -->
            </tbody>
        </table>
        <p id="mensagem-vazia" class="mensagem-vazia" hidden>Nenhum livro cadastrado ainda.</p>
    </main>
</body>
</html>
